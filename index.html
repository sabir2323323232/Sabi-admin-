
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabii - Admin Secure Login</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sabii: {
              gold: '#C5A059',
              lightgold: '#E5D3B3',
              darkgold: '#A37F38',
              accent: '#D4AF37',
              bg: '#FAF9F6',
            }
          },
          fontFamily: {
            brand: ['Cormorant Garamond', 'serif'],
            sans: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF9F6;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
    }
    .sabii-card {
      background: #FFFFFF;
      border: 1px solid rgba(197, 160, 89, 0.25);
      box-shadow: 0 10px 30px rgba(197, 160, 89, 0.08);
    }
    .sabii-gold-text {
      background: linear-gradient(135deg, #A37F38 0%, #C5A059 50%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sabii-button {
      background: linear-gradient(135deg, #C5A059 0%, #D4AF37 50%, #A37F38 100%);
      transition: all 0.3s ease;
      color: #FFFFFF;
    }
    .sabii-button:hover {
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.35);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-stone-800">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

  <div class="sabii-card max-w-md w-full rounded-3xl p-8 space-y-6 bg-white shadow-2xl border-2 border-sabii-gold/30">
    <div class="text-center space-y-2">
      <div class="w-16 h-16 rounded-2xl bg-sabii-gold/15 text-sabii-darkgold flex items-center justify-center mx-auto text-2xl shadow-inner border border-sabii-gold/30">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="text-2xl font-bold font-brand sabii-gold-text">Sabii Admin Portal</h1>
      <p class="text-xs text-stone-500">Only authorized admin (<span class="font-semibold text-stone-700">sabirkhansadre@gmail.com</span>) can login.</p>
    </div>

    <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Admin Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400 text-xs"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" id="admin-email" value="sabirkhansadre@gmail.com" required class="w-full pl-9 pr-3 py-2.5 rounded-xl text-xs border border-sabii-gold/30 focus:outline-none focus:border-sabii-gold bg-stone-50/50">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400 text-xs"><i class="fa-solid fa-lock"></i></span>
          <input type="password" id="admin-password" value="sabirhira1" required class="w-full pl-9 pr-3 py-2.5 rounded-xl text-xs border border-sabii-gold/30 focus:outline-none focus:border-sabii-gold bg-stone-50/50">
        </div>
      </div>

      <button type="submit" id="login-btn" class="w-full py-3 rounded-xl sabii-button font-bold text-xs uppercase tracking-wider shadow-md flex items-center justify-center gap-2">
        <span>Login To Admin Panel</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC0ufsDkglGIXuU8Tj3wg4-yexoI6oxBm4",
      authDomain: "sabi-3ea84.firebaseapp.com",
      projectId: "sabi-3ea84",
      storageBucket: "sabi-3ea84.firebasestorage.app",
      messagingSenderId: "124632688151",
      appId: "1:124632688151:web:b4804b0cc7f301d30d9e52",
      measurementId: "G-837LHT24Y3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-stone-900 border-sabii-gold text-sabii-lightgold' : 'bg-red-900 border-red-500 text-white';
      toast.className = `p-3.5 rounded-xl border ${bgColor} shadow-xl text-xs font-semibold flex items-center justify-between gap-3`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    };

    window.handleAdminLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const btn = document.getElementById('login-btn');

      if (email.toLowerCase() !== "sabirkhansadre@gmail.com") {
        showToast("Yeh email authorized admin email nahi hai!", "error");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Logging in...`;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showToast("Admin login successful!", "success");
        setTimeout(() => {
          window.location.href = "admin-dashboard.html";
        }, 1000);
      } catch (err) {
        console.error(err);
        showToast("Login failed! Password ya email check karein.", "error");
        btn.disabled = false;
        btn.innerHTML = `<span>Login To Admin Panel</span> <i class="fa-solid fa-arrow-right"></i>`;
      }
    };
  </script>
</body>
</html>
