<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabii - Admin Jobs Management</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sabii: {
              gold: '#C5A059',
              lightgold: '#E5D3B3',
              darkgold: '#A37F38',
              accent: '#D4AF37',
              bg: '#FAF9F6',
            }
          },
          fontFamily: {
            brand: ['Cormorant Garamond', 'serif'],
            sans: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF9F6;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
    }
    .sabii-card {
      background: #FFFFFF;
      border: 1px solid rgba(197, 160, 89, 0.25);
      box-shadow: 0 10px 30px rgba(197, 160, 89, 0.06);
    }
    .sabii-gold-text {
      background: linear-gradient(135deg, #A37F38 0%, #C5A059 50%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sabii-button {
      background: linear-gradient(135deg, #C5A059 0%, #D4AF37 50%, #A37F38 100%);
      color: #FFFFFF;
      transition: all 0.3s ease;
    }
    .sabii-button:hover {
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.35);
    }
    .sabii-input {
      background: #FFFFFF;
      border: 1px solid rgba(197, 160, 89, 0.3);
    }
    .sabii-input:focus {
      border-color: #C5A059;
      outline: none;
      box-shadow: 0 0 8px rgba(197, 160, 89, 0.25);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-stone-800">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

  <!-- Add Job Modal -->
  <div id="job-modal" class="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center hidden p-4">
    <div class="sabii-card max-w-lg w-full rounded-3xl p-6 space-y-4 bg-white shadow-2xl relative">
      <div class="flex items-center justify-between border-b border-sabii-gold/20 pb-3">
        <h3 class="text-base font-bold font-brand text-stone-800 flex items-center gap-2">
          <i class="fa-solid fa-briefcase text-sabii-gold"></i> Post New Offline Job
        </h3>
        <button onclick="closeJobModal()" class="w-8 h-8 rounded-full bg-stone-100 text-stone-600 flex items-center justify-center hover:bg-stone-200 transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="job-form" onsubmit="handleJobUpload(event)" class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-stone-700 mb-1">Job Title</label>
          <input type="text" id="j-title" placeholder="e.g. Salesman & Supplying" required class="w-full px-3 py-2.5 rounded-xl sabii-input">
        </div>
        <div>
          <label class="block font-semibold text-stone-700 mb-1">Salary / Pay</label>
          <input type="text" id="j-salary" placeholder="e.g. Rs 20,000 / Month" required class="w-full px-3 py-2.5 rounded-xl sabii-input">
        </div>
        <div>
          <label class="block font-semibold text-stone-700 mb-1">Locations</label>
          <input type="text" id="j-location" placeholder="e.g. Peshawar, Mardan, Swabi" required class="w-full px-3 py-2.5 rounded-xl sabii-input">
        </div>
        <div>
          <label class="block font-semibold text-stone-700 mb-1">Timing / Shift</label>
          <input type="text" id="j-timing" placeholder="e.g. Full Time (8 Hours Duty)" required class="w-full px-3 py-2.5 rounded-xl sabii-input">
        </div>

        <button type="submit" id="upload-btn" class="w-full py-3 rounded-xl sabii-button font-bold uppercase tracking-wider shadow-md mt-2">
          Publish Job Post
        </button>
      </form>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-stone-900 border-b-2 border-sabii-gold text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-sabii-gold/20 border border-sabii-gold flex items-center justify-center text-sabii-lightgold font-brand font-bold text-xl">
          S
        </div>
        <div>
          <h1 class="font-brand text-xl font-bold text-sabii-lightgold leading-none">Jobs Management Control</h1>
          <span class="text-[9px] text-stone-400 uppercase tracking-widest">Admin Panel</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openJobModal()" class="py-2 px-3.5 rounded-xl sabii-button font-bold text-xs shadow-md flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Post Job
        </button>
        <a href="admin-dashboard.html" class="py-2 px-3.5 rounded-xl bg-sabii-gold/20 border border-sabii-gold/40 text-sabii-lightgold hover:bg-sabii-gold hover:text-white transition text-xs font-bold flex items-center gap-2">
          <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
      </div>
    </div>
  </header>

  <!-- Main Area -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    
    <!-- Job Applications Section -->
    <div class="sabii-card rounded-3xl p-6 bg-white space-y-4 shadow-sm">
      <div class="flex items-center justify-between border-b border-sabii-gold/20 pb-3">
        <h2 class="text-base font-bold font-brand text-stone-800 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-users text-sabii-gold"></i> User Job Applications
        </h2>
        <span id="app-count" class="text-[10px] text-sabii-darkgold font-bold bg-sabii-gold/10 px-2.5 py-1 rounded-full border border-sabii-gold/20">Loading...</span>
      </div>

      <!-- Applications Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-stone-200 text-stone-400 uppercase text-[10px]">
              <th class="py-3 px-3">Job Applied For</th>
              <th class="py-3 px-3">User UID</th>
              <th class="py-3 px-3">Date / Time</th>
              <th class="py-3 px-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="applications-table-body">
            <tr>
              <td colspan="4" class="text-center py-12 text-stone-400 text-xs">
                <i class="fa-solid fa-spinner fa-spin text-sabii-gold text-xl mb-2"></i>
                <p>Loading job applications...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Existing Job Posts Management Section -->
    <div class="sabii-card rounded-3xl p-6 bg-white space-y-4 shadow-sm">
      <div class="flex items-center justify-between border-b border-sabii-gold/20 pb-3">
        <h2 class="text-base font-bold font-brand text-stone-800 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-briefcase text-sabii-gold"></i> Active Job Listings
        </h2>
        <span id="job-count" class="text-[10px] text-sabii-darkgold font-bold bg-sabii-gold/10 px-2.5 py-1 rounded-full border border-sabii-gold/20">Loading...</span>
      </div>

      <div id="admin-jobs-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <div class="col-span-full text-center py-8 text-stone-400 text-xs">Loading jobs...</div>
      </div>
    </div>

  </main>

  <footer class="p-3 text-center border-t border-stone-100 bg-white text-[10px] text-stone-400 shadow-inner">
    &copy; Sabii Application. Master Admin Panel.
  </footer>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC0ufsDkglGIXuU8Tj3wg4-yexoI6oxBm4",
      authDomain: "sabi-3ea84.firebaseapp.com",
      projectId: "sabi-3ea84",
      storageBucket: "sabi-3ea84.firebasestorage.app",
      messagingSenderId: "124632688151",
      appId: "1:124632688151:web:b4804b0cc7f301d30d9e52",
      measurementId: "G-837LHT24Y3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-stone-900 border-sabii-gold text-sabii-lightgold' : 'bg-red-900 border-red-500 text-white';
      toast.className = `p-3.5 rounded-xl border ${bgColor} shadow-xl text-xs font-semibold flex items-center justify-between gap-3`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    };

    window.openJobModal = function() {
      document.getElementById('job-modal').classList.remove('hidden');
    };

    window.closeJobModal = function() {
      document.getElementById('job-modal').classList.add('hidden');
    };

    // Upload New Job
    window.handleJobUpload = async function(e) {
      e.preventDefault();
      const title = document.getElementById('j-title').value.trim();
      const salary = document.getElementById('j-salary').value.trim();
      const location = document.getElementById('j-location').value.trim();
      const timing = document.getElementById('j-timing').value.trim();

      const btn = document.getElementById('upload-btn');
      btn.disabled = true;
      btn.innerText = "Publishing...";

      try {
        const newJobRef = push(ref(db, 'admin/jobs/offline'));
        await set(newJobRef, { title, salary, location, timing, timestamp: Date.now() });
        showToast("Job successfully publish ho gayi!", "success");
        closeJobModal();
        document.getElementById('job-form').reset();
      } catch (err) {
        console.error(err);
        showToast("Job publish karne me masla aya!", "error");
      } finally {
        btn.disabled = false;
        btn.innerText = "Publish Job Post";
      }
    };

    // Fetch Job Applications (`admin/jobApplications`)
    onValue(ref(db, 'admin/jobApplications'), (snapshot) => {
      const tbody = document.getElementById('applications-table-body');
      const countEl = document.getElementById('app-count');
      tbody.innerHTML = "";

      if (!snapshot.exists()) {
        countEl.innerText = "0 Applications";
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-12 text-stone-400 text-xs">Koi job application mojood nahi hai.</td></tr>`;
        return;
      }

      let count = 0;
      snapshot.forEach((childSnap) => {
        count++;
        const item = childSnap.val();
        const key = childSnap.key;

        const tr = document.createElement('tr');
        tr.className = "border-b border-stone-100 hover:bg-stone-50 transition";
        tr.innerHTML = `
          <td class="py-3 px-3 font-bold text-stone-800">${item.jobTitle || 'N/A'}</td>
          <td class="py-3 px-3 text-stone-600">UID: ${item.uid ? item.uid.substring(0, 10) + '...' : 'N/A'}</td>
          <td class="py-3 px-3 text-stone-400">${new Date(item.timestamp || Date.now()).toLocaleDateString()}</td>
          <td class="py-3 px-3 text-right">
            <button onclick="deleteApp('${key}')" class="px-2.5 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold transition">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      countEl.innerText = `${count} Applications`;
    });

    // Fetch Active Jobs (`admin/jobs/offline`)
    onValue(ref(db, 'admin/jobs/offline'), (snapshot) => {
      const grid = document.getElementById('admin-jobs-grid');
      const countEl = document.getElementById('job-count');
      grid.innerHTML = "";

      if (!snapshot.exists()) {
        countEl.innerText = "0 Jobs";
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-stone-400 text-xs">Koi job list nahi hai.</div>`;
        return;
      }

      let count = 0;
      snapshot.forEach((childSnap) => {
        count++;
        const job = childSnap.val();
        const key = childSnap.key;

        const card = document.createElement('div');
        card.className = "sabii-card rounded-2xl p-4 flex flex-col justify-between space-y-3 bg-stone-50/50 text-xs";
        card.innerHTML = `
          <div class="space-y-1">
            <span class="font-bold sabii-gold-text">${job.salary}</span>
            <h4 class="font-bold text-stone-800 text-sm">${job.title}</h4>
            <p class="text-[11px] text-stone-500"><i class="fa-solid fa-location-dot text-sabii-gold mr-1"></i> ${job.location}</p>
            <p class="text-[11px] text-stone-500"><i class="fa-solid fa-clock text-sabii-gold mr-1"></i> ${job.timing}</p>
          </div>
          <button onclick="deleteJob('${key}')" class="w-full py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold transition shadow-sm">
            <i class="fa-solid fa-trash mr-1"></i> Delete Job Post
          </button>
        `;
        grid.appendChild(card);
      });
      countEl.innerText = `${count} Jobs`;
    });

    window.deleteApp = async function(key) {
      if (confirm("Kya aap is application ko delete karna chahte hain?")) {
        await remove(ref(db, `admin/jobApplications/${key}`));
        showToast("Application delete ho gayi!", "success");
      }
    };

    window.deleteJob = async function(key) {
      if (confirm("Kya aap is job post ko delete karna chahte hain?")) {
        await remove(ref(db, `admin/jobs/offline/${key}`));
        showToast("Job post delete ho gayi!", "success");
      }
    };
  </script>
</body>
</html>
